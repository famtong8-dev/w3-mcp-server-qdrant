[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "w3-mcp-server-qdrant"
version = "0.1.2"
description = "MCP server for vector search with Qdrant and Ollama embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "W3 Labs", email = "dev@w3labs.io"}]
keywords = ["mcp", "qdrant", "vector-search", "ollama", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "qdrant-client>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
w3-mcp-server-qdrant = "server:main"

[project.urls]
Homepage = "https://github.com/famtong8-dev/w3-mcp-server-qdrant"
Repository = "https://github.com/famtong8-dev/w3-mcp-server-qdrant"
Documentation = "https://github.com/famtong8-dev/w3-mcp-server-qdrant/blob/main/README.md"
Issues = "https://github.com/famtong8-dev/w3-mcp-server-qdrant/issues"
Changelog = "https://github.com/famtong8-dev/w3-mcp-server-qdrant/releases"

[tool.setuptools]
py-modules = ["server"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py311"
